name: CPU examples
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.5 matplotlib==3.11.2 scipy==1.18.1
      - run: python -m unittest tests.test_examples tests.test_workflow -v
      - run: for script in 04-slurm/*.sh 04-slurm/*.sbatch; do bash -n "$script"; done
      - run: python -m py_compile 04-slurm/*.py
